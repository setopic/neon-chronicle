# 実装側の検査。**graph-check.yml とは別のファイルにしてある。**
# あちらはテンプレートが配るファイルで、ここに実装のテストを書き足すと
# テンプレートを取り込むたびに競合する。
#
# このファイルは .gitattributes の merge=ours で守られており、
# **プロジェクト側が書き換えてよい。** テンプレートの更新で上書きされない。
name: app-check

on:
  push:
  pull_request:

env:
  # ARCH-01 のGodotの版。上げるときは文書と一緒に直す。
  GODOT_VERSION: "4.7.2"

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 言語ファイルのキーの抜けとJSONの書き損じを、Godotを使わずに見る。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: data と lang のJSONを確かめる
        run: python game/ci/check_data.py

      # 書き出しはしない。書き出しテンプレートは約1GBあり、毎回落とすには重い。
      # 起動して数秒動かせば、スクリプトの構文の誤りとJSONの読み込みの失敗はログに出る。
      # Godotはそれらがあっても終了コード0で終わるので、ログの ERROR で判定する。
      - uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Godotを用意する
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSLo /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
      - name: ヘッドレスで起動して、エラーが出ないか確かめる
        working-directory: game
        run: |
          ~/godot/godot --headless --path . --import > /dev/null 2>&1
          ~/godot/godot --headless --path . --quit-after 120 2>&1 | tee /tmp/godot.log
          if grep -E "^(SCRIPT )?ERROR" /tmp/godot.log; then
            echo "::error::Godotの起動中にエラーが出た"
            exit 1
          fi

      # 決まった手順で最初から最後まで自動で遊び、エンディングにたどり着くかを見る（DOM-08）。
      # 時間は早送りで進めるので、数秒で終わる。たどり着かなければ終了コード1になる。
      # スクリプトの誤りで止まらずに回り続けたときのために、timeout で打ち切る。
      - name: 最初から最後まで遊んで、エンディングにたどり着くか確かめる
        working-directory: game
        run: timeout 300 ~/godot/godot --headless --path . --script res://ci/playthrough.gd

      # セーブの時刻をずらしてロードし、閉じていた時間の分だけ進むかを見る（ADR-0007）。
      - name: 閉じていた時間の分だけ進むか確かめる
        working-directory: game
        run: timeout 120 ~/godot/godot --headless --path . --script res://ci/away.gd

      # 人物のイベントが周をまたいで決まった順に進み、前の選択で文と選択肢が変わるかを見る（DOM-13）。
      - name: 人物のイベントが周をまたいで進むか確かめる
        working-directory: game
        run: timeout 120 ~/godot/godot --headless --path . --script res://ci/characters.gd
